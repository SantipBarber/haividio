    <script>
      const tl = gsap.timeline({ paused: true });
      const bars = { steps: ["#s1", "#s2", "#s3", "#s4"], fixes: ["#f1", "#f2", "#f3", "#f4", "#f5"] };
      const activate = (idx, at, steps = bars.steps) => {
        steps.forEach((s, i) => {
          tl.to(s, {
            color: i === idx ? "#11140a" : i < idx ? "#f4f5f7" : "#a3a8b8",
            backgroundColor: i === idx ? "#d4ff3a" : "rgba(212,255,58,0)",
            borderColor: i === idx ? "#d4ff3a" : i < idx ? "#3a3f4d" : "#232733",
            duration: 0.35, ease: "power2.out",
          }, at);
        });
      };
      // La barra nace en la escena 3a, cuando la voz dice «Un RAG tiene dos momentos».
      tl.from("#tracker .step", { autoAlpha: 0, y: -20, stagger: 0.08, duration: 0.5, ease: "power3.out" }, 80.2);
      activate(0, 91.42);
      activate(1, 106.98);
      activate(2, 122.6);
      activate(3, 139.96);
      // La barra de arreglos nace con «Primer arreglo» y se enciende con cada uno.
      tl.from("#fixes .step", { autoAlpha: 0, y: -20, stagger: 0.08, duration: 0.5, ease: "power3.out" }, 182.62);
      activate(0, 182.72, bars.fixes);
      activate(1, 202.56, bars.fixes);
      activate(2, 219.18, bars.fixes);
      activate(3, 252.92, bars.fixes);
      activate(4, 285.14, bars.fixes);
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
    </script>
