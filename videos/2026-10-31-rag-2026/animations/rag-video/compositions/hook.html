  <script>
    (() => {
      // Nube de vectores ilustrativa con semilla fija (render determinista).
      let seed = 2025;
      const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
      const cloud = document.querySelector("#hk-dots");
      const cols = ["#5ce1e6", "#a78bfa", "#8b90a0"];
      const dots = [];
      for (let i = 0; i < 46; i++) {
        const d = document.createElement("i");
        d.style.left = (20 + rnd() * 880).toFixed(0) + "px";
        d.style.top = (14 + rnd() * 182).toFixed(0) + "px";
        d.style.background = cols[i % 3];
        d.style.opacity = 0.8;
        cloud.appendChild(d); dots.push(d);
      }
      const hits = [dots[4], dots[17], dots[29]];

      gsap.set("#hk-chg", { autoAlpha: 0 });
      // Muro de titulares: cada recorte con su giro.
      const chips = gsap.utils.toArray("#root .chip");

      gsap.set("#hk-who", { x: 0, y: 210, scale: 1.25 });
      gsap.set("#hk-what", { x: 0, y: 250, scale: 1.15 });

      const tl = gsap.timeline({ paused: true });
      // Fotograma 0: la nube ya está; deriva suave mientras habla.
      tl.fromTo(dots, { x: (i) => ((i * 37) % 60) - 30, y: (i) => ((i * 23) % 40) - 20 },
        { x: 0, y: 0, duration: 6.2, ease: "sine.inOut" }, 0);
      // «El equipo de Claude Code» (0.70)
      tl.from("#hk-who", { autoAlpha: 0, y: "+=30", duration: 0.7, ease: "expo.out" }, 0.55);

      // «probó la receta estándar» (6.53–7.06): la caja envuelve la nube.
      tl.to(["#hk-who", "#hk-what"], { y: 0, scale: 1, duration: 0.5, ease: "power4.out" }, 6.4);
      tl.from("#hk-box", { autoAlpha: 0, scale: 1.06, duration: 0.7, ease: "expo.out" }, 6.4);
      tl.from("#hk-box-lbl", { autoAlpha: 0, x: -16, duration: 0.4, ease: "power2.out" }, 6.6);

      tl.to("#hk-link", { stroke: "#d4ff3a", duration: 0.3 }, 9.7);

      tl.from("#hk-strike", { scaleX: 0, duration: 0.45, ease: "power3.out" }, 11.25);
      tl.to("#hk-box", { borderColor: "#ff6b4a", duration: 0.3 }, 11.4);
      tl.to("#hk-recipe", { rotation: -3, y: 40, opacity: 0.35, duration: 0.9, ease: "power2.in", transformOrigin: "650px 530px" }, 11.7);

      tl.fromTo("#hk-chg", { autoAlpha: 0, y: 70 }, { autoAlpha: 1, y: 0, duration: 0.6, ease: "expo.out" }, 21.05);
      tl.from("#hk-form", { autoAlpha: 0, y: 40, duration: 0.7, ease: "expo.out" }, 21.45);

      const W = [[0.0,0.0],[0.5,0.5],[0.697,0.74],[1.022,1.02],[1.15,1.14],[1.429,1.66],[2.218,2.26],[2.439,2.42],[2.543,2.5],[2.718,2.66],[3.356,3.26],[3.507,3.46],[4.076,3.94],[4.436,4.26],[4.947,4.66],[5.167,4.98],[6.177,5.9],[6.526,6.1],[6.642,6.26],[7.06,6.58],[7.896,7.22],[8.151,7.38],[8.302,7.5],[8.418,7.62],[9.196,8.02],[9.904,8.5],[11.239,9.54],[11.39,9.62],[11.529,9.78],[12.493,10.58],[12.772,10.82],[13.759,11.54],[14.084,11.86],[15.024,12.46],[15.349,12.66],[15.5,12.86],[15.744,13.06],[16.568,13.78],[16.8,13.94],[17.427,14.54],[17.613,14.66],[18.785,15.62],[19.668,16.5],[19.911,16.7],[20.004,16.82],[20.84,17.62],[21.003,17.78],[21.479,18.22],[21.595,18.34],[22.535,19.14],[22.709,19.3],[22.826,19.42],[23.058,19.62],[24.103,20.1],[24.451,20.22],[24.521,20.34],[25.148,20.82],[25.507,21.1],[26.053,21.38],[26.216,21.5],[26.355,21.62],[26.529,21.82],[26.668,21.9],[26.773,22.14],[28.55,23.52]];
      for (let i = 0; i < W.length - 1; i++) {
        warp.fromTo(tl, { time: W[i][0] }, { time: W[i + 1][0], duration: W[i + 1][1] - W[i][1], ease: "none", immediateRender: false }, W[i][1]);
      }
