  <script>
    (() => {
      // Mismo reparto que la miniatura de Vectorizar (semilla 7), a tamaño completo.
      let s = 7;
      const rnd = () => ((s = (s * 16807) % 2147483647) / 2147483647);
      const centers = [[230, 330, "#5ce1e6"], [650, 250, "#a78bfa"], [560, 580, "#ff6b4a"]];
      const dotsEl = document.querySelector("#b-dots");
      const dots = [];
      centers.forEach(([cx, cy, col]) => {
        for (let i = 0; i < 16; i++) {
          const ang = rnd() * Math.PI * 2, rad = 15 + rnd() * 105;
          const x = cx + Math.cos(ang) * rad, y = cy + Math.sin(ang) * rad * 0.8;
          const d = document.createElement("div");
          d.className = "dot"; d.style.left = x + "px"; d.style.top = y + "px"; d.style.background = col; d.style.opacity = 0.75;
          dotsEl.appendChild(d); dots.push({ el: d, x, y });
        }
      });
      // La pregunta cae en la zona de «devoluciones»; sus 3 vecinos reales se calculan, no se eligen a mano.
      const Q = [400, 290];
      const qEl = document.querySelector("#b-q"), ring = document.querySelector("#b-ring");
      qEl.style.left = ring.style.left = Q[0] + "px"; qEl.style.top = ring.style.top = Q[1] + "px";
      const dist = (p) => Math.hypot(p.x - Q[0], p.y - Q[1]);
      const near = dots.slice().sort((a, b) => dist(a) - dist(b)).slice(0, 3);
      const R = Math.ceil(dist(near[2]) + 24);
      ring.style.width = ring.style.height = R * 2 + "px";
      ring.style.margin = `-${R}px 0 0 -${R}px`;
      const svg = document.querySelector("#b-links");
      const lines = near.map((p) => {
        const l = document.createElementNS("http://www.w3.org/2000/svg", "line");
        const len = dist(p);
        Object.entries({ x1: Q[0], y1: Q[1], x2: p.x, y2: p.y, stroke: "#d4ff3a", "stroke-width": 3, "stroke-dasharray": len, "stroke-dashoffset": len })
          .forEach(([k, v]) => l.setAttribute(k, v));
        svg.appendChild(l); return l;
      });

      const tl = gsap.timeline({ paused: true });
      tl.from("#b-title", { autoAlpha: 0, y: 50, duration: 0.8, ease: "expo.out" }, 0.1);
      tl.from("#b-plot", { autoAlpha: 0, duration: 0.5 }, 0.1);
      tl.from(dots.map((d) => d.el), { autoAlpha: 0, scale: 0, duration: 0.35, ease: "back.out(2)", stagger: { each: 0.01, from: "random" } }, 0.2);
      // «llega una pregunta» (1.1)
      tl.from(["#b-qlbl", "#b-pill"], { autoAlpha: 0, y: 24, duration: 0.6, ease: "expo.out", stagger: 0.08 }, 1.1);
      // «la conviertes en vector» (3.2)
      tl.from("#b-vec", { autoAlpha: 0, x: -20, duration: 0.5, ease: "power2.out" }, 3.2);
      tl.from("#b-cap", { autoAlpha: 0, y: 14, duration: 0.5, ease: "power2.out" }, 3.2);
      tl.fromTo(qEl, { autoAlpha: 0, scale: 3 }, { autoAlpha: 1, scale: 1, duration: 0.6, ease: "expo.out" }, 3.8);
      // «buscas los trozos que quedan más cerca» (4.7–6.4)
      tl.fromTo(ring, { autoAlpha: 0, scale: 0.2 }, { autoAlpha: 1, scale: 1, duration: 0.8, ease: "power3.out" }, 4.7);
      tl.to(dots.filter((d) => !near.includes(d)).map((d) => d.el), { opacity: 0.22, duration: 0.5 }, 5.2);
      tl.to(near.map((d) => d.el), { opacity: 1, scale: 1.5, duration: 0.4, ease: "back.out(3)", stagger: 0.12 }, 5.3);
      lines.forEach((l, i) => tl.to(l, { attr: { "stroke-dashoffset": 0 }, duration: 0.4, ease: "power2.out" }, 5.4 + i * 0.12));
      tl.from(["#b-r1", "#b-r2", "#b-r3"], { autoAlpha: 0, x: -40, duration: 0.5, ease: "expo.out", stagger: 0.1 }, 5.4);

      /* warp:start (generado por build_root.py: no editar) */
      window.__timelines = window.__timelines || {};
      const warp = gsap.timeline({ paused: true });
      const W = [[0.0,0.0],[1.126,0.88],[1.451,1.28],[1.602,1.44],[2.647,2.48],[3.053,2.84],[3.17,2.96],[3.669,3.44],[3.785,3.76],[4.551,4.16],[4.725,4.36],[5.143,4.72],[5.317,4.88],[5.7,5.28],[5.84,5.413],[6.177,5.68],[6.397,5.84],[7.4,6.6],[7.4,7.8]];
      for (let i = 0; i < W.length - 1; i++) {
        warp.fromTo(tl, { time: W[i][0] }, { time: W[i + 1][0], duration: W[i + 1][1] - W[i][1], ease: "none", immediateRender: false }, W[i][1]);
      }
      window.__timelines["search"] = warp;
      /* warp:end */
    })();
  </script>
