  <script>
    (() => {
      // Datos ilustrativos con semilla fija: el render es determinista.
      let seed = 384;
      const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);

      // Rejilla de 384 casillas (32 × 12): cada casilla es un número del vector.
      const grid = document.querySelector("#e-grid");
      const cells = [];
      for (let r = 0; r < 12; r++) for (let c = 0; c < 32; c++) {
        const v = rnd(), el = document.createElement("i");
        el.style.left = c * 18 + "px"; el.style.top = r * 18 + "px";
        el.style.background = v > 0.88 ? "#d4ff3a" : `rgba(139,144,160,${(0.25 + v * 0.6).toFixed(2)})`;
        grid.appendChild(el); cells.push(el);
      }

      // Mapa del significado en miniatura (mismo reparto que en la escena Buscar, escalado).
      const S = 400 / 840, OX = 20, OY = 40;
      const centers = { a: [230, 330, "#5ce1e6"], b: [650, 250, "#a78bfa"], c: [560, 580, "#ff6b4a"] };
      let s2 = 7;
      const r2 = () => ((s2 = (s2 * 16807) % 2147483647) / 2147483647);
      const dotsEl = document.querySelector("#e-dots");
      const dots = [];
      Object.values(centers).forEach(([cx, cy, col]) => {
        for (let i = 0; i < 16; i++) {
          const ang = r2() * Math.PI * 2, rad = 15 + r2() * 105;
          const d = document.createElement("div");
          d.className = "dot";
          d.style.left = (cx + Math.cos(ang) * rad) * S + OX + "px";
          d.style.top = (cy + Math.sin(ang) * rad * 0.8) * S + OY + "px";
          d.style.background = col; d.style.opacity = 0.75;
          dotsEl.appendChild(d); dots.push(d);
        }
      });
      const newDot = document.querySelector("#e-new");
      const target = [250 * S + OX, 310 * S + OY];
      newDot.style.left = target[0] + "px"; newDot.style.top = target[1] + "px";

      const tl = gsap.timeline({ paused: true });
      // «convertir cada trozo» (local 0.9)
      tl.from("#e-title", { autoAlpha: 0, y: 50, duration: 0.9, ease: "expo.out" }, 0.6);
      tl.from("#e-frag", { autoAlpha: 0, x: -60, duration: 0.7, ease: "expo.out" }, 1.5);
      // «en un vector» (2.7): la rejilla se rellena.
      tl.from("#e-a1", { autoAlpha: 0, x: -20, duration: 0.4, ease: "power2.out" }, 2.6);
      tl.from(cells, { autoAlpha: 0, scale: 0, duration: 0.25, ease: "power2.out", stagger: { each: 0.006, from: "start" } }, 2.8);
      // «Un vector es…» (4.0)
      tl.from("#e-gloss", { autoAlpha: 0, x: -40, duration: 0.6, ease: "expo.out" }, 4.0);
      // «lista de números» (5.5) · «cientos de ellos» (6.5)
      tl.from("#e-nums", { autoAlpha: 0, y: 12, duration: 0.5, ease: "power2.out" }, 5.5);
      tl.from("#e-384", { autoAlpha: 0, y: 24, duration: 0.6, ease: "expo.out" }, 6.5);
      // «resume de qué habla el texto» (8.3): aparece el mapa con sus temas.
      tl.from("#e-a2", { autoAlpha: 0, x: -20, duration: 0.4, ease: "power2.out" }, 8.3);
      tl.from("#e-plot", { autoAlpha: 0, scale: 0.94, duration: 0.6, ease: "expo.out" }, 8.6);
      tl.from(dots, { autoAlpha: 0, scale: 0, duration: 0.4, ease: "back.out(2)", stagger: { each: 0.02, from: "random" } }, 9.0);
      tl.from(["#e-la", "#e-lb", "#e-lc"], { autoAlpha: 0, duration: 0.5, stagger: 0.2 }, 10.2);
      tl.to(cells, { opacity: 0.5, duration: 0.6 }, 11.0);
      // «No hace falta entender los números» (11.0–12.3): la rejilla parpadea.
      tl.to(cells, { opacity: 1, duration: 0.2, yoyo: true, repeat: 1, stagger: { each: 0.004, from: "random" } }, 12.0);
      // «textos que hablan de lo mismo» (15.0) · «acaban cerca» (17.1)
      tl.from("#e-cap", { autoAlpha: 0, y: 14, duration: 0.5, ease: "power2.out" }, 15.0);
      tl.fromTo(newDot, { autoAlpha: 0, x: -target[0], y: 160 - target[1], scale: 1.6 },
        { autoAlpha: 1, x: 0, y: 0, scale: 1, duration: 1.0, ease: "expo.out" }, 16.2);
      tl.from("#e-near", { autoAlpha: 0, y: 12, duration: 0.5, ease: "power2.out" }, 16.9);

      /* warp:start (generado por build_root.py: no editar) */
      window.__timelines = window.__timelines || {};
      const warp = gsap.timeline({ paused: true });
      const W = [[0.0,0.0],[0.868,0.994],[1.484,1.551],[1.739,1.783],[2.331,2.375],[2.563,2.596],[2.703,2.677],[3.782,3.42],[4.015,3.583],[4.769,3.942],[4.978,4.059],[5.129,4.21],[5.431,4.488],[5.535,4.581],[6.534,5.208],[7.126,5.742],[7.277,5.87],[8.113,6.311],[8.275,6.462],[8.984,6.984],[9.181,7.147],[9.367,7.286],[9.634,7.507],[9.796,7.623],[10.969,8.157],[11.131,8.273],[11.375,8.47],[11.712,8.726],[12.153,9.109],[12.35,9.295],[13.465,9.875],[13.616,9.956],[14.672,10.595],[14.893,10.792],[15.009,10.92],[15.195,11.094],[15.636,11.489],[15.775,11.582],[16.089,11.826],[16.193,11.919],[16.31,12.035],[17.053,12.557],[17.587,13.01],[19.13,14.35]];
      for (let i = 0; i < W.length - 1; i++) {
        warp.fromTo(tl, { time: W[i][0] }, { time: W[i + 1][0], duration: W[i + 1][1] - W[i][1], ease: "none", immediateRender: false }, W[i][1]);
      }
      window.__timelines["embed"] = warp;
      /* warp:end */
    })();
  </script>
