  <script>
    (() => {
      // Grafo ilustrativo: nombres inventados. k = tipo (persona, empresa, producto), c = comunidad.
      const N = {
        tecmet: { x: 870, y: 380, t: "Tecmet", k: "e", c: 1 },
        fundix: { x: 1110, y: 345, t: "Fundix", k: "e", c: 1 },
        p12:    { x: 990, y: 480, t: "pieza P-12", k: "p", c: 1 },
        kora:   { x: 1400, y: 560, t: "robot Kora", k: "p", c: 2 },
        nordica:{ x: 1560, y: 470, t: "Nórdica", k: "e", c: 2 },
        ana:    { x: 1520, y: 670, t: "Ana López", k: "h", c: 2 },
        marta:  { x: 860, y: 780, t: "Marta Gil", k: "h", c: 3 },
        bexa:   { x: 1090, y: 760, t: "Bexa", k: "e", c: 3 },
        luis:   { x: 960, y: 865, t: "Luis Vera", k: "h", c: 3 },
      };
      const E = [["tecmet", "p12"], ["fundix", "p12"], ["p12", "kora"], ["kora", "nordica"], ["nordica", "ana"], ["kora", "ana"],
                 ["marta", "kora"], ["marta", "bexa"], ["bexa", "luis"], ["marta", "luis"], ["ana", "marta"]];
      const COL = { 1: "#5ce1e6", 2: "#a78bfa", 3: "#ff8e75" };

      const nodesEl = document.querySelector("#gr-nodes");
      const byKind = { h: [], e: [], p: [] }, byComm = { 1: [], 2: [], 3: [] };
      Object.entries(N).forEach(([id, n]) => {
        const d = document.createElement("div");
        d.className = "node"; d.id = "gr-n-" + id;
        d.style.left = n.x + "px"; d.style.top = n.y + "px";
        const l = document.createElement("div");
        l.className = "nl"; l.id = "gr-l-" + id; l.textContent = n.t;
        l.style.left = n.x + 22 + "px"; l.style.top = n.y - 18 + "px";
        nodesEl.appendChild(d); nodesEl.appendChild(l);
        byKind[n.k].push(d, l); byComm[n.c].push(d);
        n.el = d;
      });
      const g = document.querySelector("#gr-edges");
      const lines = E.map(([a, b]) => {
        const ln = document.createElementNS("http://www.w3.org/2000/svg", "line");
        ln.setAttribute("x1", N[a].x); ln.setAttribute("y1", N[a].y);
        ln.setAttribute("x2", N[b].x); ln.setAttribute("y2", N[b].y);
        ln.id = "gr-e-" + a + "-" + b;
        g.appendChild(ln);
        return ln;
      });

      const tl = gsap.timeline({ paused: true });
      gsap.set(["#gr-a1", "#gr-a2", "#gr-cost", "#gr-end", "#gr-moda"], { autoAlpha: 0 });

      // «Para las preguntas globales está GraphRAG» (0.0–2.4) · «Microsoft» (4.4)
      tl.from("#gr-kick", { autoAlpha: 0, x: -20, duration: 0.5, ease: "power2.out" }, 0.05);
      tl.from("#gr-title", { autoAlpha: 0, y: 40, duration: 0.8, ease: "expo.out" }, 2.2);
      tl.from("#gr-ms", { autoAlpha: 0, x: -14, duration: 0.5, ease: "power2.out" }, 4.3);
      // Mientras, aparecen los fragmentos que va a leer.
      tl.from(["#gr-f1", "#gr-f2", "#gr-f3"], { autoAlpha: 0, x: -50, duration: 0.6, ease: "expo.out", stagger: 0.2 }, 0.3);
      // «extrae entidades» (8.2): los nombres se iluminan.
      tl.to("#root .frag .e", { color: "#f4f5f7", fontWeight: 700, duration: 0.3, stagger: 0.08 }, 8.2);
      // «personas» (10.4) · «empresas» (11.5) · «productos» (12.6)
      tl.from(byKind.h, { autoAlpha: 0, scale: 0.4, duration: 0.45, ease: "back.out(2)", stagger: 0.08 }, 10.3);
      tl.from(byKind.e, { autoAlpha: 0, scale: 0.4, duration: 0.45, ease: "back.out(2)", stagger: 0.08 }, 11.4);
      tl.from(byKind.p, { autoAlpha: 0, scale: 0.4, duration: 0.45, ease: "back.out(2)", stagger: 0.08 }, 12.5);
      // «y cómo se conectan» (13.7–14.4): las aristas crecen desde su origen.
      lines.forEach((ln, i) => {
        const [a] = E[i];
        tl.from(ln, { attr: { x2: N[a].x, y2: N[a].y }, duration: 0.5, ease: "power2.out" }, 13.7 + i * 0.1);
      });
      // «Construye un grafo» (15.3): los fragmentos ya no hacen falta.
      tl.to(["#gr-f1", "#gr-f2", "#gr-f3"], { autoAlpha: 0, x: -40, duration: 0.4, ease: "power2.in", stagger: 0.08 }, 15.3);
      tl.from("#gr-cap", { autoAlpha: 0, y: 14, duration: 0.5, ease: "power2.out" }, 15.6);
      // «lo agrupa en comunidades» (16.9–18.0)
      tl.from(["#gr-c1", "#gr-c2", "#gr-c3"], { autoAlpha: 0, scale: 0.7, transformOrigin: "50% 50%", duration: 0.7, ease: "expo.out", stagger: 0.2 }, 16.9);
      [1, 2, 3].forEach((c, i) => tl.to(byComm[c], { borderColor: COL[c], backgroundColor: COL[c], duration: 0.4 }, 17.1 + i * 0.2));
      // «con resúmenes» (18.25)
      tl.from(["#gr-s1", "#gr-s2", "#gr-s3"], { autoAlpha: 0, y: 14, duration: 0.5, ease: "expo.out", stagger: 0.2 }, 18.2);

      // «'¿cuáles son los grandes temas?'» (20.9): las tres etiquetas responden.
      tl.to("#gr-a1", { autoAlpha: 1, duration: 0.01 }, 20.7);
      tl.from("#gr-a1", { x: -40, duration: 0.6, ease: "expo.out" }, 20.7);
      tl.to(["#gr-s1", "#gr-s2", "#gr-s3"], { scale: 1.12, duration: 0.3, yoyo: true, repeat: 1, ease: "sine.inOut", stagger: 0.15 }, 22.0);
      // «'¿qué proveedores dependen de esta pieza?'» (23.6–25.5): camino resaltado.
      tl.to("#gr-a2", { autoAlpha: 1, duration: 0.01 }, 23.4);
      tl.from("#gr-a2", { x: -40, duration: 0.6, ease: "expo.out" }, 23.4);
      tl.to("#gr-n-p12", { borderColor: "#d4ff3a", backgroundColor: "#d4ff3a", scale: 1.5, duration: 0.4, ease: "back.out(2)" }, 25.2);
      tl.to(["#gr-e-tecmet-p12", "#gr-e-fundix-p12"], { attr: { stroke: "#d4ff3a", "stroke-width": 5 }, duration: 0.4, stagger: 0.15 }, 25.4);
      tl.to(["#gr-l-tecmet", "#gr-l-fundix"], { color: "#d4ff3a", duration: 0.4, stagger: 0.15 }, 25.5);

      // «El precio: construir y mantener ese grafo» (26.7–29.9) · «bastante más caro» (30.1)
      tl.to("#gr-cost", { autoAlpha: 1, duration: 0.01 }, 26.8);
      tl.from("#gr-cl", { autoAlpha: 0, y: 12, duration: 0.5, ease: "power2.out" }, 26.8);
      tl.from(["#gr-br1", "#gr-br2"], { autoAlpha: 0, duration: 0.4, stagger: 0.2 }, 27.8);
      tl.from(["#gr-bar1", "#gr-bar2"], { scaleX: 0, duration: 0.9, ease: "power3.out", stagger: 0.4 }, 28.0);
      tl.from("#gr-expensive", { autoAlpha: 0, y: 16, duration: 0.5, ease: "expo.out" }, 30.0);

      // «Úsalo cuando las relaciones sean el corazón del problema» (31.8–35.1)
      tl.to(["#gr-a1", "#gr-a2"], { autoAlpha: 0, x: -30, duration: 0.4, ease: "power2.in" }, 31.7);
      tl.to("#gr-end", { autoAlpha: 1, duration: 0.01 }, 32.2);
      tl.from("#gr-end", { y: 30, duration: 0.7, ease: "expo.out" }, 32.2);
      // «no por moda» (35.8)
      tl.to("#gr-moda", { autoAlpha: 1, duration: 0.4 }, 35.8);

      /* warp:start (generado por build_root.py: no editar) */
      window.__timelines = window.__timelines || {};
      const warp = gsap.timeline({ paused: true });
      const W = [[0.0,0.0],[0.255,0.29],[0.395,0.464],[0.859,0.975],[1.625,1.591],[2.345,2.368],[3.587,3.251],[3.727,3.413],[4.423,4.18],[5.77,5.236],[5.956,5.41],[6.165,5.573],[6.269,5.677],[6.49,5.898],[7.512,6.664],[8.197,7.256],[8.951,7.964],[9.056,8.104],[10.403,9.23],[11.517,9.996],[12.643,10.832],[13.56,11.575],[13.723,11.726],[13.944,11.935],[14.06,12.063],[15.302,13.084],[15.894,13.688],[15.987,13.804],[16.649,14.327],[16.788,14.478],[16.916,14.559],[17.31,14.988],[17.415,15.128],[18.054,15.766],[18.25,15.975],[19.574,17.067],[19.876,17.357],[20.143,17.624],[20.886,18.274],[21.478,19.029],[21.652,19.203],[21.815,19.354],[22.175,19.702],[23.208,20.294],[23.568,20.561],[23.928,20.863],[24.648,21.49],[25.158,21.931],[25.275,22.013],[25.507,22.21],[26.691,23.348],[26.923,23.534],[27.794,24.346],[28.456,24.904],[28.525,24.973],[28.978,25.414],[29.152,25.589],[29.86,25.902],[30.058,26.007],[30.569,26.413],[30.766,26.599],[31.823,27.318],[32.647,27.748],[32.949,28.027],[33.065,28.259],[33.854,29.083],[34.261,29.42],[34.388,29.559],[34.899,29.931],[35.085,30.093],[35.84,30.72],[36.025,30.906],[36.211,31.103],[37.57,32.23]];
      for (let i = 0; i < W.length - 1; i++) {
        warp.fromTo(tl, { time: W[i][0] }, { time: W[i + 1][0], duration: W[i + 1][1] - W[i][1], ease: "none", immediateRender: false }, W[i][1]);
      }
      window.__timelines["graphrag"] = warp;
      /* warp:end */
    })();
  </script>
