name: Publicar haividio.dev

on:
  push:
    branches: [main]
    paths: ["site/**", "wrangler.jsonc"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - name: Avisar si faltan los secretos
        if: env.HAS_TOKEN != 'true'
        run: echo "::warning::Falta el secreto CLOUDFLARE_API_TOKEN; no se publica. Ver docs/web.md."
      - uses: actions/checkout@v7
        if: env.HAS_TOKEN == 'true'
      - uses: cloudflare/wrangler-action@v4
        if: env.HAS_TOKEN == 'true'
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.158.0"
          command: deploy
